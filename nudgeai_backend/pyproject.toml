[project]
name = "nudgeai-backend"
version = "0.1.0"
description = "NudgeAI backend — voice-first habit and task companion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "redis>=5.2",
    "httpx>=0.27",
    "openai>=1.55",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = [
    "S101",  # assert is fine in tests and invariants
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# memory_service builds hybrid-retrieval SQL by interpolating only fixed
# fragments (score expression, optional kind predicate). Every user-controlled
# value is a bound parameter, so S608 is a false positive here.
"app/services/memory_service.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["alembic.*", "pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
